resources:
  jobs:
    setup_datawarehouse_job:
      name: "Setup Data Warehouse - ${bundle.target}"
      
      tasks:
        - task_key: setup_warehouse
          notebook_task:
            notebook_path: ../notebooks/setup_datawarehouse.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          
          timeout_seconds: 3600
          max_retries: 1
        
        - task_key: create_metric_view
          depends_on:
            - task_key: setup_warehouse
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../sql_scripts/metric_view.sql
          
          timeout_seconds: 600
          max_retries: 1
      
      schedule:
        quartz_cron_expression: "0 0 2 * * ?" # Daily at 2 AM
        timezone_id: "UTC"
        pause_status: PAUSED
      
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      
      tags:
        environment: ${bundle.target}
        project: semantic_model_demo
